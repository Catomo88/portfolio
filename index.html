<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>build log — 원준 아빠의 프로젝트 콘솔</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   TOKENS — single source of truth (concept: build log / blueprint console)
   unchanged from the approved moodboard
   ============================================================ */
:root {
  /* type */
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --font-sans: "IBM Plex Sans KR", Pretendard, system-ui, sans-serif;
  /* scale 1.250 — Major Third */
  --fs-12: 12px; --fs-15: 15px; --fs-16: 16px;
  --fs-20: 20px; --fs-25: 25px; --fs-31: 31px; --fs-39: 39px;
  /* spacing — 8px grid (4px micro) */
  --s-4: 4px; --s-8: 8px; --s-12: 12px; --s-16: 16px;
  --s-24: 24px; --s-32: 32px; --s-48: 48px;
  /* form */
  --radius: 6px;
  --grid-step: 24px;
  --border-w: 1px;
  /* layout (derived) */
  --row-h: 48px;              /* one log line = one touch target */
  --wrap: 1120px;

  /* DARK */
  --bg: #0E1116;
  --grid: #1B212B;
  --surface: #151A21;
  --surface-2: #19202A;
  --border: #232A33;
  --text: #E6E9EE;
  --text-2: #9AA4B2;
  --text-dim: #5C6673;
  --accent: #E8A33D;          /* amber — interaction / current position only */
  --accent-soft: rgba(232,163,61,0.12);
  --inset-hi: rgba(255,255,255,0.03);
  --card-shadow: none;

  /* status signals (project state, never interaction) */
  --st-wip: #6FA8DC;
  --st-live: #5FB37A;
  --st-paused: #7E8794;
}

html[data-theme="light"] {
  --bg: #F4F2EC;
  --grid: #E2DFD5;
  --surface: #FBFAF6;
  --surface-2: #F1EFE6;
  --border: #D9D5C8;
  --text: #24272B;
  --text-2: #5B6068;
  --text-dim: #8A8F97;
  --accent: #B5731A;
  --accent-soft: rgba(181,115,26,0.10);
  --inset-hi: rgba(0,0,0,0.0);
  --card-shadow: 0 1px 0 rgba(0,0,0,0.04);
  --st-wip: #3F7FB8;
  --st-live: #4A9663;
  --st-paused: #7E8794;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { background: var(--bg); }

body {
  font-family: var(--font-sans);
  font-size: var(--fs-16);
  line-height: 1.6;
  color: var(--text);
  /* SIGNATURE 1: blueprint micro-grid background */
  background-color: var(--bg);
  background-image:
    linear-gradient(to right, var(--grid) var(--border-w), transparent var(--border-w)),
    linear-gradient(to bottom, var(--grid) var(--border-w), transparent var(--border-w));
  background-size: var(--grid-step) var(--grid-step);
  -webkit-font-smoothing: antialiased;
  /* Korean: break between words, never inside them */
  word-break: keep-all; overflow-wrap: anywhere;
  transition: background-color 180ms ease, color 180ms ease;
  min-height: 100vh;
}

.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--s-16); }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ============================================================
   HEADER — scrolls away (only the command bar stays)
   ============================================================ */
.header { border-bottom: var(--border-w) solid var(--border); background: var(--bg); }
.header__inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-12);
  padding: var(--s-8) var(--s-16) var(--s-4);
  max-width: var(--wrap); margin: 0 auto;
}
.brand { min-width: 0; }
.brand__line {
  font-family: var(--font-mono); font-size: var(--fs-12);
  letter-spacing: 0.04em; color: var(--text-dim); text-transform: lowercase;
}
.brand__title {
  font-family: var(--font-mono); font-weight: 600;
  font-size: clamp(var(--fs-25), 6vw, var(--fs-39));
  color: var(--text); line-height: 1.1; letter-spacing: -0.01em;
  white-space: nowrap;
}
/* SIGNATURE 3: blinking amber caret */
.caret {
  display: inline-block; color: var(--accent); font-weight: 400; margin-left: 2px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.theme-toggle {
  flex: none;
  font-family: var(--font-mono); font-size: var(--fs-12);
  color: var(--text-2); background: var(--surface);
  border: var(--border-w) solid var(--border); border-radius: var(--radius);
  padding: var(--s-8) var(--s-12); min-height: 44px;
  cursor: pointer; letter-spacing: 0.04em;
  transition: border-color 180ms ease, color 180ms ease;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--text); }

/* stats row — left-aligned mono numerals, one line */
.stats {
  display: flex; flex-wrap: wrap; gap: var(--s-4) var(--s-12);
  padding: 0 var(--s-16) var(--s-8);
  line-height: 1.3;
  max-width: var(--wrap); margin: 0 auto;
}
.stat { display: flex; align-items: baseline; gap: var(--s-4); }
.stat__num {
  font-family: var(--font-mono); font-weight: 500;
  font-size: var(--fs-15); color: var(--text-2);
}
.stat__num--live { color: var(--st-live); }
.stat__num--wip { color: var(--st-wip); }
.stat__label {
  font-family: var(--font-mono); font-size: var(--fs-12);
  color: var(--text-dim); letter-spacing: 0.04em; text-transform: lowercase;
}

/* ============================================================
   COMMAND BAR — sticky: grep + filter tokens (the "find" layer)
   ============================================================ */
.cmdbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  border-bottom: var(--border-w) solid var(--border);
}
.cmdbar__inner {
  max-width: var(--wrap); margin: 0 auto;
  padding: var(--s-8) var(--s-16) 0;
  display: flex; flex-direction: column; gap: 0;
}
.grep {
  display: flex; align-items: center; gap: var(--s-8);
  height: 44px;
  background: var(--surface);
  border: var(--border-w) solid var(--border); border-radius: var(--radius);
  padding: 0 var(--s-4) 0 var(--s-12);
  transition: border-color 150ms ease;
}
.grep:focus-within { border-color: var(--accent); }
.grep__prompt {
  font-family: var(--font-mono); font-size: var(--fs-12);
  color: var(--accent); letter-spacing: 0.02em; flex: none;
}
.grep__input {
  flex: 1; min-width: 0; height: 100%;
  font-family: var(--font-sans); font-size: var(--fs-16);  /* 16px: no iOS zoom */
  color: var(--text); background: transparent; border: 0; outline: none;
}
.grep__input::placeholder { color: var(--text-dim); }
.grep__input::-webkit-search-cancel-button { display: none; }
.grep__clear {
  flex: none; width: 44px; height: 44px; margin: -1px 0;
  font-family: var(--font-mono); font-size: var(--fs-15);
  color: var(--text-dim); background: transparent; border: 0; border-radius: var(--radius);
  cursor: pointer;
}
.grep__clear:hover { color: var(--accent); }
.grep__clear[hidden] { display: none; }

/* SIGNATURE 4: filter chips = command tokens, one horizontally scrollable line */
.filters {
  display: flex; gap: var(--s-8); align-items: stretch;
  overflow-x: auto; scrollbar-width: none;
  margin: 0 calc(-1 * var(--s-16)); padding: 0 var(--s-16);
  -webkit-overflow-scrolling: touch;
}
.filters::-webkit-scrollbar { display: none; }
.filter-group { display: flex; gap: var(--s-8); flex: none; }
.filter-sep { width: var(--border-w); background: var(--border); flex: none; margin: var(--s-12) 0; }
.chip {
  flex: none; height: 44px; padding: 0;      /* 44px hit box */
  background: none; border: 0; cursor: pointer; color: inherit;
  display: flex; align-items: center;
  font-family: var(--font-mono); font-size: var(--fs-12);
}
.chip:focus-visible { outline: none; }
.chip__face {                                /* 32px visible token */
  display: flex; align-items: center; height: 32px;
  color: var(--text-2); background: var(--surface);
  border: var(--border-w) solid var(--border); border-radius: var(--radius);
  padding: 0 var(--s-12);
  letter-spacing: 0.02em; white-space: nowrap;
  transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
}
.chip:focus-visible .chip__face { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip:hover .chip__face { border-color: var(--accent); color: var(--text); }
.chip__face::before { content: "[ "; color: var(--text-dim); white-space: pre; }
.chip__face::after  { content: " ]"; color: var(--text-dim); white-space: pre; }
.chip[aria-pressed="true"] .chip__face { color: var(--text); background: var(--accent-soft); border-color: var(--accent); }
.chip[aria-pressed="true"] .chip__face::before { content: "[ \2022 "; color: var(--accent); }
.chip__n { color: var(--text-dim); margin-left: var(--s-4); }

/* ============================================================
   CONSOLE LABEL — `$ ls` line with sort + live result count
   ============================================================ */
.console-label {
  display: flex; justify-content: space-between; align-items: center; gap: var(--s-8);
  min-height: 44px; margin-top: var(--s-4);
  font-family: var(--font-mono); font-size: var(--fs-12);
  color: var(--text-dim); letter-spacing: 0.04em;
}
.count { color: var(--text-2); white-space: nowrap; }
/* sort: the native select is invisible and stretched over a 44px hit box */
.sort { position: relative; display: inline-flex; align-items: center; height: 44px; }
.sort__face {
  color: var(--accent);
  border-bottom: var(--border-w) dashed var(--border);
  padding: 0 14px 1px 2px; line-height: 1.3;
  background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%);
  background-position: right 5px center, right 1px center;
  background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
}
.sort-select {
  position: absolute; top: 0; left: -8px; width: calc(100% + 16px); height: 100%;
  opacity: 0; cursor: pointer; border: 0;
  font-family: var(--font-mono); font-size: var(--fs-16);
  appearance: none; -webkit-appearance: none;
}
.sort:hover .sort__face { border-bottom-color: var(--accent); }
.sort:focus-within .sort__face { outline: 2px solid var(--accent); outline-offset: 2px; }
.sort-select option { color: var(--text); background: var(--surface); }

/* ============================================================
   PROJECT LOG — mobile: one framed log, one line per build
   ============================================================ */
.log-list {
  position: relative;
  list-style: none;
  background: var(--surface);
  border: var(--border-w) solid var(--border); border-radius: var(--radius);
  box-shadow: var(--card-shadow), inset 0 var(--border-w) 0 var(--inset-hi);
}
/* SIGNATURE: crop marks on the log frame */
.log-list::before, .log-list::after {
  content: ""; position: absolute; width: 8px; height: 8px;
  border-color: var(--text-dim); opacity: 0.55; pointer-events: none;
}
.log-list::before { top: -5px; left: -5px; border-top: var(--border-w) solid; border-left: var(--border-w) solid; }
.log-list::after  { bottom: -5px; right: -5px; border-bottom: var(--border-w) solid; border-right: var(--border-w) solid; }

.item { position: relative; border-top: var(--border-w) solid var(--border); }
.item:first-child { border-top: 0; }
.item[hidden] { display: none; }

.item__row { display: flex; align-items: stretch; min-height: var(--row-h); }

.item__toggle {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: var(--s-12);
  padding: 0 var(--s-8) 0 var(--s-12);
  background: transparent; border: 0; color: inherit; font: inherit; text-align: left;
  cursor: pointer;
}
.item__toggle:focus-visible { outline-offset: -2px; }

.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }     /* only dots are round */
.dot--live   { background: var(--st-live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-live) 20%, transparent); }
.dot--wip    { background: var(--st-wip); }
.dot--paused { background: transparent; border: var(--border-w) solid var(--st-paused); }

.item__title {
  flex: 1; min-width: 0; text-wrap: pretty;
  font-family: var(--font-sans); font-weight: 500; font-size: var(--fs-16);
  line-height: 1.3; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item[data-status="paused"] .item__title { color: var(--text-2); }
.item__title mark { background: var(--accent-soft); color: inherit; box-shadow: inset 0 -1px 0 var(--accent); }

.item__when {
  flex: none; min-width: 32px; text-align: right;
  font-family: var(--font-mono); font-size: var(--fs-12);
  color: var(--text-dim); letter-spacing: 0.01em;
}
/* expand marker: + / − in mono, rotates meaning not shape */
.item__mark {
  flex: none; width: 12px; text-align: center;
  align-self: stretch; display: flex; align-items: center; justify-content: center;
  padding-left: var(--s-12); border-left: var(--border-w) dashed var(--border);
  box-sizing: content-box;
  font-family: var(--font-mono); font-size: var(--fs-15); color: var(--text-dim);
}
.item__mark::before { content: "+"; }
.item__toggle[aria-expanded="true"] .item__mark::before { content: "\2212"; color: var(--accent); }

/* live: one tap from the list */
.item__open {
  flex: none; display: flex; align-items: center; gap: var(--s-4);
  padding: 0 var(--s-12);
  font-family: var(--font-mono); font-size: var(--fs-12); letter-spacing: 0.02em;
  color: var(--st-live); text-decoration: none;
  border-left: var(--border-w) solid var(--border);
  transition: color 150ms ease, background 150ms ease;
}
.item__open:hover { color: var(--accent); background: var(--accent-soft); }
.item__open:focus-visible { outline-offset: -2px; }
/* reserve the same column for non-live rows so titles stay aligned */
.item__open--none { width: 68px; flex: none; }

/* current position: amber edge on the open row */
.item.is-open { background: var(--surface-2); }
.item.is-open::before {
  content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px;
  width: 2px; background: var(--accent);
}

/* detail — the log entry body, indented like a tree branch */
.item__detail {
  padding: 0 var(--s-12) var(--s-12) calc(var(--s-12) + 8px + var(--s-12));
  display: flex; flex-direction: column; gap: var(--s-8);
}
.item__detail[hidden] { display: none; }
.item__desc { font-size: var(--fs-15); color: var(--text-2); line-height: 1.6; text-wrap: pretty; }

.tags { display: flex; flex-wrap: wrap; gap: var(--s-4) var(--s-8); }
.tag {
  font-family: var(--font-mono); font-size: var(--fs-12);
  color: var(--text-2); background: var(--surface-2);
  border: var(--border-w) solid var(--border); border-radius: var(--radius);
  padding: 0 var(--s-8); letter-spacing: 0.02em;
}

/* SIGNATURE 2: mono log line */
.item__foot {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: var(--s-4) var(--s-12);
  border-top: var(--border-w) dashed var(--border);
  padding-top: var(--s-8);
}
.log { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text-dim); letter-spacing: 0.01em; }
.log__st { display: inline-flex; align-items: center; gap: 6px; }
.log__st .dot { width: 6px; height: 6px; box-shadow: none; }
.log__st--live { color: var(--st-live); }
.log__st--wip { color: var(--st-wip); }
.log__st--paused { color: var(--st-paused); }
.links { display: flex; gap: var(--s-24); padding-right: var(--s-12); }
.link {
  font-family: var(--font-mono); font-size: var(--fs-12);
  color: var(--text-2); letter-spacing: 0.02em;
  display: inline-block; line-height: 18px;
  padding: 13px 12px; margin: -13px -12px;   /* 44px hit box, text stays put */
  text-decoration: underline dotted transparent; text-underline-offset: 3px;
  transition: color 150ms ease, border-color 150ms ease;
}
.link:hover { color: var(--accent); text-decoration-color: var(--accent); }

.empty {
  font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text-dim);
  padding: var(--s-16) var(--s-12);
}
.empty[hidden] { display: none; }

footer {
  font-family: var(--font-mono); font-size: var(--fs-12);
  color: var(--text-dim); letter-spacing: 0.02em;
  padding: var(--s-24) 0 var(--s-32);
}

/* ============================================================
   DESKTOP (≥ 760px) — the log opens up into tiles again.
   Same markup; every entry is shown expanded.
   ============================================================ */
@media (min-width: 760px) {
  .header__inner, .stats, .cmdbar__inner { padding-left: var(--s-24); padding-right: var(--s-24); }
  .wrap { padding: 0 var(--s-24); }
  .stats { gap: var(--s-16) var(--s-24); }
  .stat__num { font-size: var(--fs-20); }
  .cmdbar__inner { flex-direction: row; align-items: center; gap: var(--s-16); }
  .grep { flex: 0 1 320px; }
  .filters { margin: 0; padding: 0; flex: 1; flex-wrap: wrap; overflow: visible; }

  .log-list {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s-16);
    background: transparent; border: 0; box-shadow: none;
  }
  .log-list::before, .log-list::after { display: none; }
  .item {
    display: flex; flex-direction: column;
    background: var(--surface);
    border: var(--border-w) solid var(--border); border-radius: var(--radius);
    box-shadow: var(--card-shadow), inset 0 var(--border-w) 0 var(--inset-hi);
    transition: border-color 180ms ease, background 180ms ease;
  }
  .item:first-child { border-top: var(--border-w) solid var(--border); }
  .item:hover { border-color: var(--accent); background: var(--surface-2); }
  /* crop marks per tile on desktop */
  .item::before, .item::after {
    content: ""; position: absolute; width: 8px; height: 8px;
    border-color: var(--text-dim); opacity: 0.55; pointer-events: none;
    transition: border-color 180ms ease, opacity 180ms ease;
  }
  .item::before { top: 6px; left: 6px; border-top: var(--border-w) solid; border-left: var(--border-w) solid; }
  .item::after  { bottom: 6px; right: 6px; border-bottom: var(--border-w) solid; border-right: var(--border-w) solid; }
  .item:hover::before, .item:hover::after { border-color: var(--accent); opacity: 1; }
  .item.is-open { background: var(--surface); }

  .item__row { min-height: 56px; border-bottom: var(--border-w) solid var(--border); }
  .item__toggle { cursor: default; padding-left: var(--s-16); }
  .item__mark { display: none; }
  .item__title { font-size: var(--fs-20); white-space: normal; }
  .item__open { border-left: 0; padding: 0 var(--s-16); }
  .item__open--none { display: none; }
  .item__detail, .item__detail[hidden] {
    display: flex; flex: 1;
    padding: var(--s-12) var(--s-16) var(--s-16);
  }
  .item__foot { margin-top: auto; }
}
@media (min-width: 1040px) {
  .log-list { grid-template-columns: repeat(3, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  .caret { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header__inner">
    <div class="brand">
      <div class="brand__line">~/papa-junkyu/builds</div>
      <h1 class="brand__title">build log<span class="caret" aria-hidden="true">▌</span></h1>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">// dark</button>
  </div>
  <div class="stats">
    <div class="stat"><span class="stat__num" id="statTotal">–</span><span class="stat__label">projects</span></div>
    <div class="stat"><span class="stat__num stat__num--live" id="statLive">–</span><span class="stat__label">live</span></div>
    <div class="stat"><span class="stat__num stat__num--wip" id="statWip">–</span><span class="stat__label">in-progress</span></div>
    <div class="stat"><span class="stat__num" id="statUpdated">–</span><span class="stat__label">upd</span></div>
  </div>
</header>

<div class="cmdbar">
  <div class="cmdbar__inner">
    <label class="grep" for="q">
      <span class="grep__prompt" aria-hidden="true">$ grep</span>
      <span class="sr-only">프로젝트 검색</span>
      <input class="grep__input" id="q" type="search" placeholder="이름 · 태그 · 설명" autocomplete="off" spellcheck="false" enterkeyhint="search" />
      <button class="grep__clear" id="qClear" type="button" aria-label="검색어 지우기" hidden>×</button>
    </label>
    <nav class="filters" aria-label="필터">
      <div class="filter-group" role="group" aria-label="상태">
        <button class="chip" type="button" data-kind="all" aria-pressed="true"><span class="chip__face">all</span></button>
        <button class="chip" type="button" data-kind="status" data-value="live" aria-pressed="false"><span class="chip__face">live<span class="chip__n" data-count="live"></span></span></button>
        <button class="chip" type="button" data-kind="status" data-value="wip" aria-pressed="false"><span class="chip__face">in-progress<span class="chip__n" data-count="wip"></span></span></button>
        <button class="chip" type="button" data-kind="status" data-value="paused" aria-pressed="false"><span class="chip__face">paused<span class="chip__n" data-count="paused"></span></span></button>
      </div>
      <span class="filter-sep" aria-hidden="true"></span>
      <div class="filter-group" role="group" aria-label="도구">
        <button class="chip" type="button" data-kind="tool" data-value="claude code" aria-pressed="false"><span class="chip__face">claude code</span></button>
        <button class="chip" type="button" data-kind="tool" data-value="cowork" aria-pressed="false"><span class="chip__face">cowork</span></button>
      </div>
    </nav>
  </div>
</div>

<main class="wrap">
  <div class="console-label">
    <span>$ ls --sort=<span class="sort"><span class="sort__face" id="sortFace" aria-hidden="true">recent</span><select id="sortSelect" class="sort-select" aria-label="정렬 방식"><option value="recent">recent</option><option value="status">status</option><option value="name">name</option><option value="tool">tool</option></select></span></span>
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <ul class="log-list" id="list" aria-label="프로젝트 목록"></ul>
  <p class="empty" id="empty" hidden></p>

  <footer id="footer">// builds logged · auto-generated from projects.json · papa junkyu</footer>
</main>

<script>
(function () {
  // ── theme toggle — dark/light are peer themes; light by default ──
  var root = document.documentElement;
  var btn = document.getElementById('themeToggle');
  function syncToggle() {
    var dark = root.getAttribute('data-theme') === 'dark';
    btn.textContent = dark ? '// light' : '// dark';
    btn.setAttribute('aria-pressed', dark ? 'false' : 'true');
  }
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    syncToggle();
  });
  syncToggle();

  // ── helpers ──
  var STATUS_LABEL = { wip: 'in-progress', live: 'live', paused: 'paused' };
  var desktop = window.matchMedia('(min-width: 760px)');

  function relTime(iso) {
    if (!iso) return '';
    var days = Math.floor((Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 86400000);
    if (days <= 0) return 'today';
    if (days < 7) return days + 'd';
    if (days < 30) return Math.floor(days / 7) + 'w';
    if (days < 365) return Math.floor(days / 30) + 'mo';
    return Math.floor(days / 365) + 'y';
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function link(cls, text, href, label) {
    var a = el('a', cls, text);
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
    if (label) a.setAttribute('aria-label', label);
    return a;
  }

  // ── one log entry ──
  function item(p, idx) {
    var name = p.display_name || p.name;
    var status = p.status || 'wip';
    var li = el('li', 'item');
    li.dataset.tool = (p.tool || '').toLowerCase();
    li.dataset.status = status;
    li.dataset.key = p.name || name;
    li.dataset.hay = [p.name, p.display_name, p.summary, p.tool, (p.tags || []).join(' ')].join(' ').toLowerCase();

    var row = el('div', 'item__row');
    var detailId = 'd-' + idx;
    var t = el('button', 'item__toggle');
    t.type = 'button';
    t.setAttribute('aria-expanded', 'false');
    t.setAttribute('aria-controls', detailId);
    var dot = el('span', 'dot dot--' + status);
    t.appendChild(dot);
    t.appendChild(el('span', 'sr-only', STATUS_LABEL[status] + ', '));
    var title = el('span', 'item__title', name);
    title.dataset.text = name;
    t.appendChild(title);
    var when = el('span', 'item__when', relTime(p.last_commit));
    when.setAttribute('aria-hidden', 'true');
    t.appendChild(when);
    var mk = el('span', 'item__mark'); mk.setAttribute('aria-hidden', 'true');
    t.appendChild(mk);
    row.appendChild(t);

    if (p.links && p.links.live) {
      row.appendChild(link('item__open', 'open↗', p.links.live, name + ' 열기 (새 탭)'));
    } else {
      var none = el('span', 'item__open--none'); none.setAttribute('aria-hidden', 'true');
      row.appendChild(none);
    }
    li.appendChild(row);

    var d = el('div', 'item__detail');
    d.id = detailId;
    d.hidden = true;
    d.appendChild(el('p', 'item__desc', p.summary || '요약 준비 중'));
    if (p.tags && p.tags.length) {
      var tags = el('div', 'tags');
      p.tags.forEach(function (x) { tags.appendChild(el('span', 'tag', x)); });
      d.appendChild(tags);
    }
    var foot = el('div', 'item__foot');
    var log = el('span', 'log');
    var st = el('span', 'log__st log__st--' + status);
    st.appendChild(el('span', 'dot dot--' + status));
    st.appendChild(document.createTextNode(STATUS_LABEL[status]));
    log.appendChild(st);
    log.appendChild(document.createTextNode(' · ' + (p.tool || '').toLowerCase() +
      ' · ' + (p.last_commit ? relTime(p.last_commit) + ' ago' : 'no commits')));
    foot.appendChild(log);
    var links = el('div', 'links');
    if (p.links && p.links.repo) links.appendChild(link('link', 'git', p.links.repo, name + ' 저장소 (새 탭)'));
    if (links.childNodes.length) foot.appendChild(links);
    d.appendChild(foot);
    li.appendChild(d);

    t.addEventListener('click', function () {
      if (desktop.matches) return;
      var open = t.getAttribute('aria-expanded') !== 'true';
      t.setAttribute('aria-expanded', open ? 'true' : 'false');
      d.hidden = !open;
      li.classList.toggle('is-open', open);
    });
    return li;
  }

  // desktop: tiles are always expanded; the header is not a control
  function syncMode() {
    document.querySelectorAll('.item').forEach(function (li) {
      var t = li.querySelector('.item__toggle');
      var d = li.querySelector('.item__detail');
      if (desktop.matches) {
        t.removeAttribute('aria-expanded');
        t.setAttribute('tabindex', '-1');
        d.hidden = false;
        li.classList.remove('is-open');
      } else {
        t.removeAttribute('tabindex');
        t.setAttribute('aria-expanded', 'false');
        d.hidden = true;
      }
    });
  }
  if (desktop.addEventListener) desktop.addEventListener('change', syncMode);
  else if (desktop.addListener) desktop.addListener(syncMode);

  // ── filter + search ──
  var state = { status: null, tool: null, q: '' };
  var input = document.getElementById('q');
  var clearBtn = document.getElementById('qClear');

  function highlight(titleEl, q) {
    var text = titleEl.dataset.text;
    titleEl.textContent = '';
    var i = q ? text.toLowerCase().indexOf(q) : -1;
    if (i < 0) { titleEl.textContent = text; return; }
    titleEl.appendChild(document.createTextNode(text.slice(0, i)));
    titleEl.appendChild(el('mark', null, text.slice(i, i + q.length)));
    titleEl.appendChild(document.createTextNode(text.slice(i + q.length)));
  }

  function apply() {
    var shown = 0, total = 0;
    document.querySelectorAll('.item').forEach(function (li) {
      total++;
      var ok = (!state.status || li.dataset.status === state.status) &&
               (!state.tool || li.dataset.tool === state.tool) &&
               (!state.q || li.dataset.hay.indexOf(state.q) !== -1);
      li.hidden = !ok;
      if (ok) shown++;
      highlight(li.querySelector('.item__title'), state.q);
    });
    document.getElementById('count').textContent = shown === total ? total + ' builds' : shown + ' / ' + total;
    var empty = document.getElementById('empty');
    empty.hidden = shown !== 0;
    if (!shown) empty.textContent = '// no match' + (state.q ? " for '" + state.q + "'" : '') + ' — [ all ]로 초기화';
  }

  function setChips() {
    document.querySelectorAll('.chip').forEach(function (c) {
      var k = c.dataset.kind, v = c.dataset.value, on;
      if (k === 'all') on = !state.status && !state.tool;
      else on = state[k] === v;
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  document.querySelector('.filters').addEventListener('click', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    var k = c.dataset.kind, v = c.dataset.value;
    if (k === 'all') { state.status = null; state.tool = null; state.q = ''; input.value = ''; clearBtn.hidden = true; }
    else state[k] = state[k] === v ? null : v;   // single-select per group, tap again to release
    setChips(); apply();
  });

  input.addEventListener('input', function () {
    state.q = input.value.trim().toLowerCase();
    clearBtn.hidden = !input.value;
    apply();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { input.value = ''; state.q = ''; clearBtn.hidden = true; apply(); }
    if (e.key === 'Enter') input.blur();   // close the phone keyboard to reveal results
  });
  clearBtn.addEventListener('click', function () {
    input.value = ''; state.q = ''; clearBtn.hidden = true; apply(); input.focus();
  });

  // ── sort ──
  var STATUS_ORDER = { live: 0, wip: 1, paused: 2 };
  function statusRank(s) { return STATUS_ORDER[s] == null ? 9 : STATUS_ORDER[s]; }
  function byName(a, b) { return (a.display_name || a.name || '').localeCompare(b.display_name || b.name || '', 'ko'); }
  function sortProjects(ps, mode) {
    ps = ps.slice();
    if (mode === 'name') ps.sort(byName);
    else if (mode === 'tool') ps.sort(function (a, b) { return (a.tool || '').localeCompare(b.tool || '') || byName(a, b); });
    else if (mode === 'status') ps.sort(function (a, b) { return (statusRank(a.status) - statusRank(b.status)) || byName(a, b); });
    else ps.sort(function (a, b) { return (b.last_commit || '').localeCompare(a.last_commit || '') || (statusRank(a.status) - statusRank(b.status)) || byName(a, b); });
    return ps;
  }

  var data = null;
  var sel = document.getElementById('sortSelect');
  function renderList() {
    var list = document.getElementById('list');
    var openKeys = [];
    list.querySelectorAll('.item.is-open').forEach(function (li) { openKeys.push(li.dataset.key); });
    document.getElementById('sortFace').textContent = sel.value;
    list.innerHTML = '';
    sortProjects(data.projects || [], sel.value).forEach(function (p, i) { list.appendChild(item(p, i)); });
    syncMode();
    if (!desktop.matches) list.querySelectorAll('.item').forEach(function (li) {
      if (openKeys.indexOf(li.dataset.key) !== -1) li.querySelector('.item__toggle').click();
    });
    apply();
  }
  sel.addEventListener('change', renderList);

  function render(d) {
    data = d;
    var ps = d.projects || [];
    function n(s) { return ps.filter(function (p) { return p.status === s; }).length; }
    document.getElementById('statTotal').textContent = ps.length;
    document.getElementById('statLive').textContent = n('live');
    document.getElementById('statWip').textContent = n('wip');
    document.getElementById('statUpdated').textContent = d.generated_at ? d.generated_at.slice(5) : '–';
    document.getElementById('statUpdated').title = d.generated_at || '';
    document.querySelectorAll('[data-count]').forEach(function (s) { s.textContent = n(s.dataset.count); });
    document.getElementById('footer').textContent = '// ' + ps.length + ' builds logged · auto-generated from projects.json · papa junkyu';
    renderList();
  }

  fetch('projects.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function (e) {
      var empty = document.getElementById('empty');
      empty.hidden = false;
      empty.textContent = '// projects.json을 불러오지 못했습니다 (' + (e && e.message ? e.message : 'error') + '). python -m http.server로 실행했는지 확인하세요.';
      console.error(e);
    });
})();
</script>
</body>
</html>
