<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>원준이 아빠의 프로젝트</title>
<meta name="description" content="가족과 일을 위해 직접 만든 것들" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script>
  /* apply the saved theme before first paint (no flash) */
  try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
/* ============================================================
   THEME A — "맑은 정돈" (Clear Order)
   inset-grouped list · ink + cobalt · status as tinted words
   cobalt = things you press, green/violet = status, ink/grey = everything else
   ============================================================ */
:root {
  color-scheme: light;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  /* type scale 13 · 15 · 17 · 20 · 26 (12 only for status words) */
  --fs-12: 12px; --fs-13: 13px; --fs-14: 14px; --fs-15: 15px; --fs-16: 16px;
  --fs-17: 17px; --fs-20: 20px; --fs-26: 26px;
  /* spacing: 4px base */
  --s-4: 4px; --s-8: 8px; --s-12: 12px; --s-16: 16px; --s-20: 20px; --s-24: 24px; --s-32: 32px;
  /* shape — no shadows anywhere */
  --r-panel: 16px; --r-field: 12px; --r-pill: 999px; --r-tag: 6px;
  --row-h: 56px;
  --wrap: 1120px;

  /* LIGHT */
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #F7F8FA;
  --line: #E6E8EC;
  --text: #141A23;
  --text-2: #4E5968;
  --text-3: #8B95A1;
  --accent: #1F57E0;
  --accent-soft: #EAF0FF;
  --on-accent: #FFFFFF;
  --live: #0C8A4F;   --live-bg: #E3F5EA;
  --wip: #6A45D9;    --wip-bg: #F0EBFF;
  --paused: #6B7684; --paused-bg: #EEF0F3;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101318;
  --surface: #1A1E25;
  --surface-2: #22272F;
  --line: #2A3039;
  --text: #F1F3F6;
  --text-2: #B0B8C1;
  --text-3: #7B8592;
  --accent: #5B8CFF;
  --accent-soft: rgba(91,140,255,.16);
  --on-accent: #0B1530;
  --live: #3DD68C;   --live-bg: rgba(61,214,140,.14);
  --wip: #A88BFF;    --wip-bg: rgba(168,139,255,.16);
  --paused: #9AA3AE; --paused-bg: rgba(154,163,174,.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); }
body {
  font-family: var(--font); font-size: var(--fs-15); line-height: 1.45;
  color: var(--text);
  word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 1;            /* numbers line up */
  min-height: 100vh;
  transition: background-color .2s ease, color .2s ease;
}
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--s-20); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg { display: block; }

/* ============================================================
   HEADER — title, theme button, 3-cell summary (scrolls away)
   ============================================================ */
.header { padding-top: var(--s-24); padding-bottom: var(--s-16); }
.header__top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-12); }
.title { font-size: var(--fs-26); font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
.subtitle { font-size: var(--fs-15); color: var(--text-2); margin-top: var(--s-4); }
.theme-btn {
  flex: none; width: 44px; height: 44px; margin: -6px -10px 0 0; border-radius: var(--r-pill);
  display: grid; place-items: center; color: var(--text-2);
  transition: background-color .2s ease, color .2s ease;
}
.theme-btn:hover { background: var(--surface); color: var(--text); }
.theme-btn svg { width: 22px; height: 22px; }
.theme-btn .i-sun { display: none; }
html[data-theme="dark"] .theme-btn .i-sun { display: block; }
html[data-theme="dark"] .theme-btn .i-moon { display: none; }

/* SIGNATURE 3: summary strip — tabular numbers in three cells */
.summary {
  margin-top: var(--s-20);
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--surface); border-radius: var(--r-panel);
}
.sum { padding: var(--s-12) var(--s-16); min-width: 0; }
.sum + .sum { border-left: 1px solid var(--line); }
.sum__n { font-size: var(--fs-20); font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
.sum__l { font-size: var(--fs-13); color: var(--text-3); font-weight: 500; }
.sum--live .sum__n { color: var(--live); }
.sum--wip .sum__n { color: var(--wip); }

/* ============================================================
   FIND BAR — sticky: search + filter chips
   ============================================================ */
.findbar { position: sticky; top: 0; z-index: 20; background: var(--bg); transition: background-color .2s ease; }
.findbar__inner { max-width: var(--wrap); margin: 0 auto; padding: var(--s-8) var(--s-20) 0; }
.search {
  display: flex; align-items: center; gap: var(--s-8);
  height: 46px; padding: 0 0 0 var(--s-12);
  background: var(--surface); border-radius: var(--r-field);
  border: 1.5px solid transparent;
  transition: border-color .15s ease;
}
.search:focus-within { border-color: var(--accent); }
.search__icon { width: 20px; height: 20px; color: var(--text-3); flex: none; }
.search input {
  flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
  font: inherit; font-size: var(--fs-16); color: var(--text);   /* 16px: no iOS zoom */
}
.search input::placeholder { color: var(--text-3); }
.search input::-webkit-search-cancel-button { display: none; }
.search__clear {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center;
  color: var(--text-3); border-radius: var(--r-field);
}
.search__clear:hover { color: var(--text); }
.search__clear svg { width: 18px; height: 18px; }
.search__clear[hidden] { display: none; }

.chips {
  display: flex; gap: var(--s-8); overflow-x: auto; scrollbar-width: none;
  margin: 0 calc(-1 * var(--s-20)); padding: var(--s-4) var(--s-20) var(--s-8);
  -webkit-overflow-scrolling: touch;
}
.chips::-webkit-scrollbar { display: none; }
.chip-group { display: flex; gap: var(--s-8); flex: none; }
.chip { flex: none; height: 44px; display: flex; align-items: center; }   /* 44px hit box */
.chip:focus-visible { outline: none; }
.chip:focus-visible .chip__face { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip__face {
  display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 var(--s-12);
  border-radius: var(--r-pill); background: var(--surface);
  font-size: var(--fs-14); font-weight: 600; color: var(--text-2); white-space: nowrap;
  transition: background-color .15s ease, color .15s ease;
}
.chip:hover .chip__face { color: var(--text); }
.chip__n { font-weight: 600; color: var(--text-3); }
/* selected = ink inversion, so cobalt stays reserved for "열기" */
.chip[aria-pressed="true"] .chip__face { background: var(--text); color: var(--surface); }
.chip[aria-pressed="true"] .chip__n { color: inherit; opacity: .6; }
.chip-sep { flex: none; width: 1px; margin: 16px 2px; background: var(--line); }

/* ============================================================
   LIST HEAD — count + sort
   ============================================================ */
.list-head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-8);
  min-height: 44px; font-size: var(--fs-13); color: var(--text-3); font-weight: 500;
}
.sort { position: relative; display: inline-flex; align-items: center; gap: 2px; height: 44px; color: var(--text-2); font-weight: 600; font-size: var(--fs-13); }
.sort svg { width: 14px; height: 14px; }
.sort select {
  position: absolute; inset: 0 -8px; width: calc(100% + 16px); height: 100%;
  opacity: 0; cursor: pointer; border: 0; font-size: var(--fs-16);
  appearance: none; -webkit-appearance: none;
}
.sort:hover { color: var(--text); }
.sort:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-tag); }
.sort select option { color: var(--text); background: var(--surface); }

/* ============================================================
   LIST — SIGNATURE 1: one inset-grouped panel, hairlines start at the title
   ============================================================ */
.list { list-style: none; background: var(--surface); border-radius: var(--r-panel); overflow: hidden; }
.item { position: relative; transition: background-color .2s ease; }
.item[hidden] { display: none; }
.item.has-line::before {
  content: ""; position: absolute; top: 0; left: var(--s-16); right: 0;
  height: 1px; background: var(--line);
}
.row { display: flex; align-items: center; min-height: var(--row-h); }
.toggle {
  flex: 1; min-width: 0; min-height: var(--row-h);
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-8) 0 var(--s-8) var(--s-16); text-align: left;
}
.toggle:focus-visible { outline-offset: -2px; }

/* name: display_name leads; folder name sits beside it, or drops to the next line when there's no room */
.names { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; row-gap: 0; }
.name {
  flex: none; max-width: 100%;
  font-size: var(--fs-17); font-weight: 600; letter-spacing: -0.01em; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.folder {
  flex: 0 0 auto; max-width: 100%;
  font-size: var(--fs-13); font-weight: 500; color: var(--text-2); line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item[data-status="paused"] .name { color: var(--text-2); }
.name mark { background: var(--accent-soft); color: inherit; border-radius: 3px; }

/* SIGNATURE 2: status as a word on a tinted ground */
.st {
  flex: none; font-size: var(--fs-12); font-weight: 600; line-height: 1;
  padding: 5px 7px; border-radius: var(--r-tag); white-space: nowrap;
}
.st--live   { color: var(--live);   background: var(--live-bg); }
.st--wip    { color: var(--wip);    background: var(--wip-bg); }
.st--paused { color: var(--paused); background: var(--paused-bg); }

.chev { flex: none; width: 12px; height: 12px; margin-right: var(--s-8); color: var(--text-3); transition: transform .2s ease, color .2s ease; }
.toggle[aria-expanded="true"] .chev { transform: rotate(90deg); color: var(--text); }

/* live: one tap from the list — the only cobalt in the row */
/* row end slot: exactly one thing, "열기" (live) or the status word (others); fixed width so edges line up */
.slot { flex: none; width: 68px; margin-right: var(--s-12); display: flex; align-items: center; justify-content: flex-end; }
.open {
  flex: none;
  height: 32px; padding: 0 var(--s-12); border-radius: var(--r-pill);
  display: flex; align-items: center;
  font-size: var(--fs-14); font-weight: 700; color: var(--accent); background: var(--accent-soft);
  text-decoration: none; position: relative;
  transition: background-color .15s ease, color .15s ease;
}
.open::after { content: ""; position: absolute; inset: -6px -4px; }   /* 44px hit area */
.open:hover { background: var(--accent); color: var(--on-accent); }

/* expanded row */
.item.is-open { background: var(--surface-2); }
.item.is-open::before, .item.is-open + .item::before { left: 0; }   /* full-width lines frame the open row */
.toggle .slot { margin-left: -4px; }   /* cancel the flex gap so chevrons line up with live rows */
.detail { padding: 0 var(--s-16) var(--s-16); display: flex; flex-direction: column; gap: var(--s-12); }
.detail[hidden] { display: none; }
.desc { font-size: var(--fs-15); color: var(--text-2); line-height: 1.6; text-wrap: pretty; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: var(--fs-13); font-weight: 500; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-tag);
  padding: 2px 8px;
}
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: var(--fs-13); }
.facts dt { color: var(--text-3); }
.facts dd { color: var(--text); font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.actions { display: flex; }
/* code link: quiet text, 44px hit box without moving the text */
.code-link {
  display: inline-block; font-size: var(--fs-14); font-weight: 600; color: var(--text-2);
  line-height: 20px; padding: 12px 8px; margin: -12px -8px -8px;
  text-decoration: underline transparent; text-underline-offset: 3px;
  transition: color .15s ease, text-decoration-color .15s ease;
}
.code-link:hover { color: var(--text); text-decoration-color: currentColor; }

.empty { font-size: var(--fs-15); color: var(--text-2); padding: var(--s-24) var(--s-16); background: var(--surface); border-radius: var(--r-panel); line-height: 1.6; }
.empty[hidden] { display: none; }

.foot { font-size: var(--fs-13); color: var(--text-3); padding: var(--s-24) var(--s-4) var(--s-32); }

/* ============================================================
   DESKTOP (≥ 760px) — the panel opens into 2–3 columns of tiles.
   Same markup; every entry is shown expanded. Still no shadows.
   ============================================================ */
@media (min-width: 760px) {
  .header { padding-top: var(--s-32); }
  .summary { max-width: 480px; }
  .findbar__inner { display: flex; align-items: center; gap: var(--s-16); padding-top: var(--s-12); padding-bottom: var(--s-4); }
  .search { flex: 0 1 340px; }
  .chips { margin: 0; padding: 0; flex: 1; flex-wrap: wrap; overflow: visible; }

  /* still ONE panel: cells are divided by 1px hairlines, not separate cards */
  .list { display: grid; grid-template-columns: repeat(2, 1fr); }
  .item { display: flex; flex-direction: column; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
  .item.has-line::before { display: none; }
  .item.is-open { background: transparent; }
  .row { min-height: 60px; align-items: flex-start; }
  .toggle { cursor: default; padding: var(--s-16) 0 var(--s-8) var(--s-20); align-items: flex-start; }
  .name { white-space: normal; }
  .chev { display: none; }
  .slot { margin: 11px var(--s-16) 0 var(--s-8); }   /* "열기" pill centred on the first title line */
  .toggle .slot { margin-top: 0; margin-left: var(--s-8); }                 /* status word already sits inside the padded toggle */
  .detail, .detail[hidden] { display: flex; flex: 1; padding: 0 var(--s-20) var(--s-20); }
  .actions { margin-top: auto; padding-top: var(--s-4); }
}
@media (min-width: 1040px) {
  .list { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<header class="header wrap">
  <div class="header__top">
    <div>
      <h1 class="title">원준이 아빠의 프로젝트</h1>
      <p class="subtitle">가족과 일을 위해 직접 만든 것들</p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="어두운 화면으로 보기">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
  </div>
  <div class="summary">
    <div class="sum"><div class="sum__n" id="statTotal">–</div><div class="sum__l">전체</div></div>
    <div class="sum sum--live"><div class="sum__n" id="statLive">–</div><div class="sum__l">라이브</div></div>
    <div class="sum sum--wip"><div class="sum__n" id="statWip">–</div><div class="sum__l">만드는 중</div></div>
  </div>
</header>

<div class="findbar">
  <div class="findbar__inner">
    <label class="search" for="q">
      <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr-only">프로젝트 검색</span>
      <input id="q" type="search" placeholder="프로젝트 찾기" autocomplete="off" spellcheck="false" enterkeyhint="search" />
      <button class="search__clear" id="qClear" type="button" aria-label="검색어 지우기" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </label>
    <nav class="chips" id="chips" aria-label="필터">
      <div class="chip-group" role="group" aria-label="상태">
        <button class="chip" type="button" data-kind="all" aria-pressed="true"><span class="chip__face">전체 <span class="chip__n" data-count="all"></span></span></button>
        <button class="chip" type="button" data-kind="status" data-value="live" aria-pressed="false"><span class="chip__face">라이브 <span class="chip__n" data-count="live"></span></span></button>
        <button class="chip" type="button" data-kind="status" data-value="wip" aria-pressed="false"><span class="chip__face">만드는 중 <span class="chip__n" data-count="wip"></span></span></button>
        <button class="chip" type="button" data-kind="status" data-value="paused" aria-pressed="false"><span class="chip__face">쉬는 중 <span class="chip__n" data-count="paused"></span></span></button>
      </div>
      <i class="chip-sep" aria-hidden="true"></i>
      <div class="chip-group" role="group" aria-label="만든 도구">
        <button class="chip" type="button" data-kind="tool" data-value="claude code" aria-pressed="false"><span class="chip__face">Claude Code</span></button>
        <button class="chip" type="button" data-kind="tool" data-value="cowork" aria-pressed="false"><span class="chip__face">Cowork</span></button>
      </div>
    </nav>
  </div>
</div>

<main class="wrap">
  <div class="list-head">
    <span id="count" aria-live="polite"></span>
    <span class="sort">
      <span id="sortFace" aria-hidden="true">최근 수정순</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      <select id="sortSelect" aria-label="정렬 방식">
        <option value="recent">최근 수정순</option>
        <option value="status">상태순</option>
        <option value="name">이름순</option>
        <option value="tool">만든 도구순</option>
      </select>
    </span>
  </div>

  <ul class="list" id="list" aria-label="프로젝트 목록"></ul>
  <p class="empty" id="empty" hidden></p>

  <p class="foot" id="foot"></p>
</main>

<script>
(function () {
  // ── theme: light by default, choice remembered ──
  var root = document.documentElement;
  var btn = document.getElementById('themeBtn');
  function syncTheme() {
    var dark = root.getAttribute('data-theme') === 'dark';
    btn.setAttribute('aria-label', dark ? '밝은 화면으로 보기' : '어두운 화면으로 보기');
  }
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    syncTheme();
  });
  syncTheme();

  // ── helpers ──
  var STATUS_LABEL = { live: '라이브', wip: '만드는 중', paused: '쉬는 중' };
  var desktop = window.matchMedia('(min-width: 760px)');
  var thisYear = new Date().getFullYear();

  function fmtDate(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    if (p.length < 3) return iso;
    var s = (+p[1]) + '월 ' + (+p[2]) + '일';
    return (+p[0] !== thisYear ? p[0] + '년 ' : '') + s;
  }
  function norm(s) { return (s || '').replace(/[\s_\-]+/g, '').toLowerCase(); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function link(cls, text, href, label) {
    var a = el('a', cls, text);
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
    if (label) a.setAttribute('aria-label', label);
    return a;
  }
  var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

  // ── one row ──
  function item(p, idx) {
    var name = p.display_name || p.name;
    var folder = p.display_name && p.name && norm(p.display_name) !== norm(p.name) ? p.name : '';
    var status = STATUS_LABEL[p.status] ? p.status : 'wip';
    var live = p.links && p.links.live;
    var repo = p.links && p.links.repo;

    var li = el('li', 'item');
    li.dataset.tool = (p.tool || '').toLowerCase();
    li.dataset.status = status;
    li.dataset.key = p.name || name;
    li.dataset.hay = [p.name, p.display_name, p.summary, p.tool, (p.tags || []).join(' ')].join(' ').toLowerCase();

    var row = el('div', 'row');
    var detailId = 'd-' + idx;
    var t = el('button', 'toggle');
    t.type = 'button';
    t.setAttribute('aria-expanded', 'false');
    t.setAttribute('aria-controls', detailId);
    var names = el('span', 'names');
    var title = el('span', 'name', name);
    title.dataset.text = name;
    names.appendChild(title);
    if (folder) {
      var f = el('span', 'folder', '(' + folder + ')');
      f.title = folder;
      names.appendChild(f);
    }
    t.appendChild(names);
    t.insertAdjacentHTML('beforeend', CHEV);
    // end slot: live rows show "열기" (it already means 라이브); others show their status word
    if (live) {
      t.appendChild(el('span', 'sr-only', ', ' + STATUS_LABEL[status]));
      row.appendChild(t);
      var slot = el('span', 'slot');
      slot.appendChild(link('open', '열기', live, name + ' 열기 (새 탭)'));
      row.appendChild(slot);
    } else {
      var stSlot = el('span', 'slot');
      stSlot.appendChild(el('span', 'st st--' + status, STATUS_LABEL[status]));
      t.appendChild(stSlot);
      row.appendChild(t);
    }
    li.appendChild(row);

    var d = el('div', 'detail');
    d.id = detailId;
    d.hidden = true;
    d.appendChild(el('p', 'desc', p.summary || '설명을 준비하고 있어요.'));
    if (p.tags && p.tags.length) {
      var tags = el('div', 'tags');
      p.tags.forEach(function (x) { tags.appendChild(el('span', 'tag', x)); });
      d.appendChild(tags);
    }
    var facts = el('dl', 'facts');
    function fact(k, v) { facts.appendChild(el('dt', null, k)); facts.appendChild(el('dd', null, v)); }
    if (p.tool) fact('만든 도구', p.tool);
    fact('마지막 수정', p.last_commit ? fmtDate(p.last_commit) : '기록 없음');
    d.appendChild(facts);
    // "열기" lives in the row only; the detail just offers the code
    if (repo) {
      var acts = el('div', 'actions');
      acts.appendChild(link('code-link', '코드 보기', repo, name + ' 코드 보기 (새 탭)'));
      d.appendChild(acts);
    }
    li.appendChild(d);

    t.addEventListener('click', function () {
      if (desktop.matches) return;
      var open = t.getAttribute('aria-expanded') !== 'true';
      t.setAttribute('aria-expanded', open ? 'true' : 'false');
      d.hidden = !open;
      li.classList.toggle('is-open', open);
    });
    return li;
  }

  // desktop: tiles are always expanded; the row is not a control
  function syncMode() {
    document.querySelectorAll('.item').forEach(function (li) {
      var t = li.querySelector('.toggle');
      var d = li.querySelector('.detail');
      if (desktop.matches) {
        t.removeAttribute('aria-expanded');
        t.setAttribute('tabindex', '-1');
        d.hidden = false;
        li.classList.remove('is-open');
      } else {
        t.removeAttribute('tabindex');
        t.setAttribute('aria-expanded', 'false');
        d.hidden = true;
        li.classList.remove('is-open');
      }
    });
  }
  if (desktop.addEventListener) desktop.addEventListener('change', syncMode);
  else if (desktop.addListener) desktop.addListener(syncMode);

  // ── filter + search ──
  var state = { status: null, tool: null, q: '' };
  var input = document.getElementById('q');
  var clearBtn = document.getElementById('qClear');

  function highlight(titleEl, q) {
    var text = titleEl.dataset.text;
    titleEl.textContent = '';
    var i = q ? text.toLowerCase().indexOf(q) : -1;
    if (i < 0) { titleEl.textContent = text; return; }
    titleEl.appendChild(document.createTextNode(text.slice(0, i)));
    titleEl.appendChild(el('mark', null, text.slice(i, i + q.length)));
    titleEl.appendChild(document.createTextNode(text.slice(i + q.length)));
  }

  function apply() {
    var shown = 0, total = 0, first = true;
    document.querySelectorAll('.item').forEach(function (li) {
      total++;
      var ok = (!state.status || li.dataset.status === state.status) &&
               (!state.tool || li.dataset.tool === state.tool) &&
               (!state.q || li.dataset.hay.indexOf(state.q) !== -1);
      li.hidden = !ok;
      li.classList.toggle('has-line', ok && !first);   // hairline only between visible rows
      if (ok) { shown++; first = false; }
      highlight(li.querySelector('.name'), state.q);
    });
    document.getElementById('count').textContent = shown === total ? total + '개 프로젝트' : total + '개 중 ' + shown + '개';
    var empty = document.getElementById('empty');
    empty.hidden = shown !== 0;
    document.getElementById('list').hidden = shown === 0;
    if (!shown) empty.textContent = state.q
      ? '‘' + input.value.trim() + '’에 맞는 프로젝트가 없어요. 검색어를 지우거나 필터를 전체로 바꿔 보세요.'
      : '찾는 프로젝트가 없어요. 필터를 전체로 바꿔 보세요.';
  }

  function setChips() {
    document.querySelectorAll('.chip').forEach(function (c) {
      var k = c.dataset.kind, v = c.dataset.value, on;
      if (k === 'all') on = !state.status && !state.tool;
      else on = state[k] === v;
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  document.getElementById('chips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    var k = c.dataset.kind, v = c.dataset.value;
    if (k === 'all') { state.status = null; state.tool = null; state.q = ''; input.value = ''; clearBtn.hidden = true; }
    else state[k] = state[k] === v ? null : v;   // one per group, tap again to release
    setChips(); apply();
  });

  input.addEventListener('input', function () {
    state.q = input.value.trim().toLowerCase();
    clearBtn.hidden = !input.value;
    apply();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { input.value = ''; state.q = ''; clearBtn.hidden = true; apply(); }
    if (e.key === 'Enter') input.blur();   // close the phone keyboard to reveal results
  });
  clearBtn.addEventListener('click', function (e) {
    e.preventDefault();
    input.value = ''; state.q = ''; clearBtn.hidden = true; apply(); input.focus();
  });

  // ── sort ──
  var STATUS_ORDER = { live: 0, wip: 1, paused: 2 };
  function statusRank(s) { return STATUS_ORDER[s] == null ? 9 : STATUS_ORDER[s]; }
  function byName(a, b) { return (a.display_name || a.name || '').localeCompare(b.display_name || b.name || '', 'ko'); }
  function sortProjects(ps, mode) {
    ps = ps.slice();
    if (mode === 'name') ps.sort(byName);
    else if (mode === 'tool') ps.sort(function (a, b) { return (a.tool || '').localeCompare(b.tool || '') || byName(a, b); });
    else if (mode === 'status') ps.sort(function (a, b) { return (statusRank(a.status) - statusRank(b.status)) || byName(a, b); });
    else ps.sort(function (a, b) { return (b.last_commit || '').localeCompare(a.last_commit || '') || (statusRank(a.status) - statusRank(b.status)) || byName(a, b); });
    return ps;
  }

  var data = null;
  var sel = document.getElementById('sortSelect');
  function renderList() {
    var list = document.getElementById('list');
    var openKeys = [];
    list.querySelectorAll('.item.is-open').forEach(function (li) { openKeys.push(li.dataset.key); });
    document.getElementById('sortFace').textContent = sel.options[sel.selectedIndex].text;
    list.innerHTML = '';
    sortProjects(data.projects || [], sel.value).forEach(function (p, i) { list.appendChild(item(p, i)); });
    syncMode();
    if (!desktop.matches) list.querySelectorAll('.item').forEach(function (li) {
      if (openKeys.indexOf(li.dataset.key) !== -1) li.querySelector('.toggle').click();
    });
    apply();
  }
  sel.addEventListener('change', renderList);

  function render(d) {
    data = d;
    var ps = d.projects || [];
    function n(s) { return ps.filter(function (p) { return p.status === s; }).length; }
    document.getElementById('statTotal').textContent = ps.length;
    document.getElementById('statLive').textContent = n('live');
    document.getElementById('statWip').textContent = n('wip');
    document.querySelectorAll('[data-count]').forEach(function (s) {
      s.textContent = s.dataset.count === 'all' ? ps.length : n(s.dataset.count);
    });
    document.getElementById('foot').textContent = d.generated_at
      ? fmtDate(d.generated_at) + '에 마지막으로 업데이트했어요.'
      : '';
    renderList();
  }

  fetch('projects.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function (e) {
      var empty = document.getElementById('empty');
      empty.hidden = false;
      empty.textContent = '프로젝트 목록을 불러오지 못했어요. 잠시 뒤 새로고침해 보세요.';
      console.error(e);
    });
})();
</script>
</body>
</html>
